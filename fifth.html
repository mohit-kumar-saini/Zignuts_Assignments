<!DOCTYPE html>
<html>
  <body>
    <input type="number" id="steps">
    <button onclick="fibonacci()">Print</button>
    <p id="result"></p>

    <script>
    function fibonacci() 
    {
        let n = document.getElementById("steps").value;
        let a = 0, b = 1, temp;
        let output = "";
        for (let i = 0; i < n; i++)
        {
          output = output + a + " ";
          temp = a + b;
          a = b;
          b = temp;
        }
        document.getElementById("result").innerHTML = output;
      }
    </script>
  </body>
</html>
