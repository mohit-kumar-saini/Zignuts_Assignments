<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login - TaskPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
  <div class="container" style="max-width:600px;">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label>Username</label>
        <input class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input class="form-control" id="password" type="password" required>
      </div>
      <button class="btn btn-primary">Login</button>
      <div id="msg" class="mt-3"></div>
    </form>
  </div>
  <script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value
    };
    const res = await fetch('/api/auth/login/', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    const el = document.getElementById('msg');
    if(res.ok) {
      const j = await res.json();
      localStorage.setItem('access', j.access);
      localStorage.setItem('refresh', j.refresh);
      window.location.href = '/dashboard/';
    } else {
      el.innerHTML = '<div class="alert alert-danger">Login failed</div>';
    }
  });
  </script>
</body>
</html>
