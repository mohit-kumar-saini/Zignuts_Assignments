<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Register - TaskPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
  <div class="container" style="max-width:600px;">
    <h2>Register</h2>
    <form id="registerForm">
      <div class="mb-3">
        <label>Username</label>
        <input class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label>Email</label>
        <input class="form-control" id="email" type="email">
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input class="form-control" id="password" type="password" required>
      </div>
      <button class="btn btn-primary">Register</button>
      <div id="msg" class="mt-3"></div>
    </form>
  </div>
  <script>
  const api = '/api/';
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
      username: document.getElementById('username').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    };
    const res = await fetch('/api/auth/register/', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    const el = document.getElementById('msg');
    if(res.ok) {
      el.innerHTML = '<div class="alert alert-success">Registered. Go to <a href="/login/">login</a></div>';
    } else {
      const txt = await res.text();
      el.innerHTML = '<div class="alert alert-danger">Error: ' + txt + '</div>';
    }
  });
  </script>
</body>
</html>
