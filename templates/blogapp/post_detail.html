{% extends "base.html" %}
{% block content %}
<h1>{{ post.title }}</h1>
<p class="text-muted">By {{ post.author }} on {{ post.created_at }}</p>
{% if post.image %}<img src='{{ post.image.url }}' class="img-fluid mb-3">{% endif %}
<div>{{ post.content|linebreaks }}</div>
{% if user == post.author %}
  <a href="{% url 'post_update' post.slug %}" class="btn btn-primary mt-3">Edit</a>
  <a href="{% url 'post_delete' post.slug %}" class="btn btn-danger mt-3">Delete</a>
{% endif %}
{% endblock %}
